name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dialogue-sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pipecat: ["1.3.0", "1.12.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Core SDK only: no provider extras, audio device, local models or credentials.
      - run: python -m pip install -e "./sidecar[dev]" "pipecat-ai==${{ matrix.pipecat }}" "websockets>=15"
      - run: python -m pytest sidecar/tests/test_eleven_dialogue_pipecat.py -q
  browser-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test dashboard/tests/*.test.mjs
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Tauri shell
        run: cargo build --release -p starlight-voice-tauri

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install the package + the deps the tests actually import (providers = httpx/ulid/openai;
      # dev = pytest/ruff). NOT the heavy voice/workflow extras — pipecat/deepagents tests
      # importorskip, so CI stays fast and the install is REAL (was: pytest-only -> ModuleNotFoundError).
      - name: Install
        run: python -m pip install -e "./sidecar[providers,dev]"
      - name: Lint (ruff)
        run: python -m ruff check sidecar dashboard/server.py benchmarks
      - name: Tests
        run: python -m pytest sidecar/tests -q
      - name: Benchmark smoke
        run: python benchmarks/run.py --probe router --n 25
