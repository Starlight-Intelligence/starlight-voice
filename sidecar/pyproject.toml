[project]
name = "starlight-voice-sidecar"
version = "0.1.0"
description = "Python sidecar for Starlight Voice"
requires-python = ">=3.12"
dependencies = []

# Extras, not base deps, on purpose (CI/OSS portability). CLOUD-FIRST (2026-06-15):
# the default `voice` extra is LIGHT — cloud STT/TTS/LLM + local audio I/O, NO CUDA.
# Frank's machine install: `uv pip install -e .[voice,providers]` (runnable today on live
# Groq+OpenRouter+ElevenLabs keys). Heavy local GPU models are the optional `voice-local`
# offline tier. Pins verified against the 2026-06-15 research synthesis.
[project.optional-dependencies]
native = [
  "httpx>=0.27",               # browser handles native audio; no Pipecat, torch or audio-device wheels
]
voice = [
  # Pipecat 1.0+ orchestrating CLOUD services + local mic/speaker I/O. No GPU/CUDA.
  # Local component sessions additionally select `voice-vad` for speech boundaries.
  # Browser native voice uses provider turn detection and does not need either extra.
  "pipecat-ai[groq,elevenlabs,cartesia,openrouter]>=1.3,<2",
  "pyaudio>=0.2.14",            # PortAudio/WASAPI local mic capture + speaker playback (needed even cloud-first)
  "websockets>=15",            # asyncio client + explicit proxy control for dialogue streaming
]
voice-vad = [
  "pipecat-ai[silero]>=1.3,<2",  # optional local speech detection; no local STT/TTS or smart-turn model
]
voice-turn = [
  "pipecat-ai[silero,local-smart-turn-v3]>=1.0,<2",  # auto turn-detection + barge-in (later phase; may pull torch)
]
voice-local = [
  # OPTIONAL offline/private tier — heavy GPU/ONNX wheels. Install only if running models locally.
  "faster-whisper>=1.1.0",
  "ctranslate2>=4.8.0",         # MANDATORY: cp313 win_amd64 wheel only landed 2026-06-06; needs cuDNN 9 / CUDA 12.3+
  "nvidia-cudnn-cu12>=9",
  "nvidia-cublas-cu12",
  "kokoro-onnx>=0.5.0",         # Apache-2.0 local TTS
  "onnxruntime",               # CPU-safe; onnxruntime-gpu init is unreliable on GTX 1650
  "piper-tts",                 # MIT, CPU-only always-works fallback TTS
]
providers = [
  "openai>=1.100.0",            # OpenRouter LLM + Groq /audio/transcriptions (OpenAI-compatible)
  "httpx>=0.27",               # OpenRouter synthesis call + provider-pin request bodies
  "ulid-py>=1.1",              # handoff-packet IDs
]
# Workflow/agent-loop engine, behind the router for non-audio tiers only
workflow = [
  "deepagents>=0.6.10",
  "langgraph>=1.0.10",
  "langgraph-checkpoint>=3.0",          # RCE patch lives here (msgpack deser CVE-2026-28277)
  "langgraph-checkpoint-sqlite>=3.0.3", # RCE patch (SQLi CVE-2025-67644)
]
browser = [
  "browser-use[core]>=0.13.0",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]  # pyflakes, pycodestyle, isort, bugbear, pyupgrade
ignore = ["E501"]                      # line-length handled by formatter, not lint-fatal

[project.scripts]
starlight-voice-sidecar = "starlight_voice.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Package dir is src/starlight_voice but project name is starlight-voice-sidecar;
# hatchling can't infer the mapping, so declare it explicitly (editable install path).
packages = ["src/starlight_voice"]
